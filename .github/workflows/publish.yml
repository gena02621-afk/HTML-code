name: Publish to Roblox
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Roblox
        run: curl -X POST "https://apis.roblox.com/universes/v1/9839609926/places/104777647658733/versions?versionType=Published" -H "x-api-key: ${{ secrets.ROBLOX_API_KEY }}" -H "Content-Type: application/octet-stream" --data-binary "@game.rbxl"
